<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo Y Cinta</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  body { font-family:Inter, system-ui, sans-serif; background:#f2f2f2; color:#111; }
  .wrap { max-width:1000px; margin:0 auto; padding:40px 16px 80px; }
  h1 { font-weight:600; font-size:28px; } p.sub { color:#666; margin:6px 0 28px; }
  .row { display:flex; flex-wrap:wrap; gap:24px; align-items:center; justify-content:center; background:#fff; border-radius:20px; padding:28px; margin-bottom:20px; }
  .ig { width:200px; aspect-ratio:1; border-radius:50%; overflow:hidden; box-shadow:0 0 0 1px #ddd; }
  .ig.sm { width:40px; }
  .ig svg, .big svg { width:100%; height:100%; display:block; }
  .big { width:260px; aspect-ratio:1; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Y de cintas · escala de grises</h1>
  <p class="sub">Dos cintas que se cruzan: la de atrás es oscura y la de adelante va de blanco a gris. Abajo la ves suelta y en el círculo de Instagram.</p>
  <div class="row" id="claro"></div>
  <div class="row" id="oscuro"></div>
</div>



<script>
// Las cintas van en un string: dentro de <template> el HTML anidaría los <path/>.
const inner = `
  <defs>
    <linearGradient id="atras" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#4a4a4a"/><stop offset=".55" stop-color="#1e1e1e"/><stop offset="1" stop-color="#0b0b0b"/>
    </linearGradient>
    <linearGradient id="atrasPliegue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a8a8a"/><stop offset="1" stop-color="#2b2b2b"/>
    </linearGradient>
    <linearGradient id="frente" x1="1" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".45" stop-color="#d6d6d6"/><stop offset="1" stop-color="#8c8c8c"/>
    </linearGradient>
    <linearGradient id="frentePliegue" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfcfcf"/><stop offset=".5" stop-color="#8f8f8f"/><stop offset="1" stop-color="#4d4d4d"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#161616"/>
    </linearGradient>
  </defs>
  <!-- Cinta de atrás: brazo izquierdo que baja a la pierna -->
  <path fill="url(#atras)" d="M215 220 C330 360 420 440 470 540 C530 660 540 820 510 925 L665 925 C700 870 720 700 665 580 C630 500 560 410 480 310 C410 230 340 215 215 220 Z"/>
  <path fill="url(#atrasPliegue)" d="M215 220 C330 215 420 230 480 310 C530 370 560 420 585 450 C560 480 545 500 535 520 C480 400 360 290 215 220 Z"/>
  <!-- Sombra donde la pierna se esconde -->
  <path fill="url(#base)" d="M527 850 C580 760 640 705 695 700 C700 800 690 880 665 925 L510 925 C518 900 523 875 527 850 Z"/>
  <!-- Cinta de adelante: brazo derecho que cae hacia el centro -->
  <path fill="url(#frentePliegue)" d="M955 220 C870 220 760 225 710 285 L590 440 C530 520 495 590 510 640 C530 720 535 790 527 850 C580 720 640 620 665 580 C760 460 860 340 955 220 Z"/>
  <path fill="url(#frente)" d="M955 220 C870 220 760 225 710 285 L590 440 C530 520 495 590 510 640 C520 690 527 760 527 850 C560 600 700 360 955 220 Z"/>
`;
// Cada copia renombra sus degradados para no chocar con las demás.
let n = 0;
const mark = () => { const k = n++; return inner.replace(/id="(\w+)"/g, `id="$1${k}"`).replace(/url\(#(\w+)\)/g, `url(#$1${k})`); };
const loose = bg => `<div class="big" style="background:${bg};border-radius:24px"><svg viewBox="140 160 900 830">${mark()}</svg></div>`;
// En el círculo el símbolo ocupa ~60 % para que respire dentro del recorte.
const ig = (bg, cls='') => `<div class="ig ${cls}"><svg viewBox="-110 -90 1400 1350"><rect x="-110" y="-90" width="1400" height="1350" fill="${bg}"/>${mark()}</svg></div>`;
document.getElementById('claro').innerHTML = loose('#fff') + ig('#fff') + ig('#fff','sm');
document.getElementById('oscuro').innerHTML = loose('#000') + ig('#000') + ig('#000','sm');
</script>
</body>
</html>
