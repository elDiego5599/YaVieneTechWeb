<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Propuestas de Símbolo</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Manrope:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; }
  body { font-family:Inter, system-ui, sans-serif; background:#efefef; color:#111; }
  .wrap { max-width:1000px; margin:0 auto; padding:40px 16px 80px; }
  h1 { font-weight:600; font-size:28px; } p.sub { color:#666; margin:6px 0 28px; max-width:700px; }
  .card { background:#fff; border-radius:24px; padding:24px; margin-bottom:20px; display:grid; grid-template-columns:1fr auto; gap:20px; align-items:center; }
  .card h2 { font-size:18px; } .card p { color:#666; font-size:14px; margin-top:4px; max-width:520px; }
  .locks { grid-column:1/-1; display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .lock { border-radius:18px; padding:30px 24px; display:flex; align-items:center; justify-content:center; gap:16px; }
  .lock.dark { background:#000; color:#fff; } .lock.light { background:#f6f6f6; color:#000; }
  .lock svg { width:52px; height:52px; flex:none; }
  .lock span { font-family:Manrope, sans-serif; font-size:30px; letter-spacing:-.02em; white-space:nowrap; }
  .lock b { font-weight:700; } .lock i { font-style:normal; font-weight:400; opacity:.55; }
  .igs { display:flex; gap:10px; align-items:center; }
  .ig { width:88px; aspect-ratio:1; border-radius:50%; overflow:hidden; box-shadow:0 0 0 1px #ddd; }
  .ig.sm { width:34px; } .ig svg { width:100%; height:100%; display:block; }
  @media (max-width:720px){ .card{ grid-template-columns:1fr; } .locks{ grid-template-columns:1fr; } .lock span{ font-size:24px; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>Símbolos propios · Ya Viene Tech</h1>
  <p class="sub">Seis ideas que salen de lo que significa “ya viene”: algo que está a punto de llegar. Cada una se ve junto al nombre, que es como va a vivir casi siempre, y en el círculo de Instagram.</p>
  <div id="out"></div>
</div>
<script>
// Lienzo 200×200. fg es el color del símbolo y bg el del fondo (para los cortes en negativo).
const ideas = [
  { t:'1 · Casi llega', s:'Un círculo al 85 % y el punto que lo completa. Es la barra de progreso a punto de terminar, y también el bus a punto de llegar a tu paradero.',
    d:(fg) => `<path d="M100 38 A62 62 0 1 1 46.3 69" fill="none" stroke="${fg}" stroke-width="24"/><circle cx="69" cy="46.3" r="13" fill="${fg}"/>` },
  { t:'2 · Escribiendo…', s:'Los tres puntos del chat cuando alguien te está escribiendo: la señal universal de que algo ya viene. Crecen hacia adelante.',
    d:(fg) => `<circle cx="44" cy="100" r="13" fill="${fg}" opacity=".35"/><circle cx="94" cy="100" r="19" fill="${fg}" opacity=".65"/><circle cx="152" cy="100" r="26" fill="${fg}"/>` },
  { t:'3 · Llegada al punto', s:'Un punto que se acerca a una barra (el paradero o la meta) y se detiene justo antes de tocarla. Es mínimo y muy de marca tech.',
    d:(fg) => `<circle cx="80" cy="100" r="40" fill="${fg}"/><rect x="136" y="46" width="24" height="108" rx="12" fill="${fg}"/>` },
  { t:'4 · Acercándose', s:'Tres cuadros que vienen hacia ti, cada uno más presente que el anterior. Da sensación de profundidad y de movimiento hacia adelante.',
    d:(fg) => `<rect x="92" y="38" width="70" height="70" rx="18" fill="${fg}" opacity=".25"/><rect x="66" y="64" width="70" height="70" rx="18" fill="${fg}" opacity=".55"/><rect x="40" y="90" width="70" height="70" rx="18" fill="${fg}"/>` },
  { t:'5 · Bifurcación', s:'Un círculo sólido con una Y cortada en negativo: una ruta que se divide. La Y está, pero escondida, que es mucho más elegante que dibujarla.',
    d:(fg, bg) => `<circle cx="100" cy="100" r="72" fill="${fg}"/><path d="M66 50 L100 96 L134 50 M100 96 L100 172" fill="none" stroke="${bg}" stroke-width="16"/>` },
  { t:'6 · Señal en camino', s:'Un punto con su estela, en tres líneas que se acortan. Es velocidad pura y se ve bien en una pieza horizontal junto al nombre.',
    d:(fg) => `<circle cx="140" cy="100" r="32" fill="${fg}"/><rect x="40" y="70" width="64" height="12" rx="6" fill="${fg}" opacity=".35"/><rect x="58" y="94" width="66" height="12" rx="6" fill="${fg}" opacity=".7"/><rect x="40" y="118" width="64" height="12" rx="6" fill="${fg}" opacity=".35"/>` },
];

const svg = (d, fg, bg, vb = '0 0 200 200', rect = '') => `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg">${rect}${d(fg, bg)}</svg>`;
// En el círculo el símbolo ocupa ~70 % para que respire dentro del recorte.
const ig = (d, fg, bg, cls = '') => `<div class="ig ${cls}">${svg(d, fg, bg, '-36 -36 272 272', `<rect x="-36" y="-36" width="272" height="272" fill="${bg}"/>`)}</div>`;
const lock = (d, fg, bg, cls) => `<div class="lock ${cls}">${svg(d, fg, bg)}<span><b>Ya Viene</b> <i>Tech</i></span></div>`;

document.getElementById('out').innerHTML = ideas.map(x => `
  <div class="card">
    <div><h2>${x.t}</h2><p>${x.s}</p></div>
    <div class="igs">${ig(x.d,'#fff','#000')}${ig(x.d,'#000','#fff')}${ig(x.d,'#fff','#000','sm')}</div>
    <div class="locks">${lock(x.d,'#fff','#000','dark')}${lock(x.d,'#000','#f6f6f6','light')}</div>
  </div>`).join('');
</script>
</body>
</html>
